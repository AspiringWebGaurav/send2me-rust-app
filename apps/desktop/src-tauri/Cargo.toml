[package]
name = "send2me"
version = "0.1.6"
description = "A Tauri App"
authors = ["Gaurav Patil"]
edition = "2021"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
send2me_core = { workspace = true }
network = { workspace = true }
protocol = { workspace = true }
transfer = { workspace = true }
sync = { workspace = true }
storage = { workspace = true }
platform = { workspace = true }
p2p_drive = { workspace = true }
iroh = { workspace = true }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = "0.4.45"
dirs = "6.0.0"
sysinfo = "0.33.0"
blake3 = "1.5.0"
machine-uid = "0.5.3"
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
obfstr = "0.4.3"
aes-gcm = "0.11.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
windows-sys = { version = "0.52.0", features = ["Win32_System_Diagnostics_Debug", "Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
