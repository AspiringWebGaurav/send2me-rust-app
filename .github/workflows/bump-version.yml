name: "Bump Version and Trigger Release"

on:
  repository_dispatch:
    types: [bump_version]

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update versions
        run: |
          NEW_VERSION="${{ github.event.client_payload.version }}"
          echo "Bumping version to $NEW_VERSION"

          # Update tauri.conf.json
          sed -i 's/"version": ".*"/"version": "'"$NEW_VERSION"'"/' apps/desktop/src-tauri/tauri.conf.json

          # Update package.json
          sed -i '0,/"version": ".*"/s//"version": "'"$NEW_VERSION"'"/' apps/desktop/package.json

          # Update Cargo.toml
          sed -i '0,/version = ".*"/s//version = "'"$NEW_VERSION"'"/' apps/desktop/src-tauri/Cargo.toml

      - name: Commit and Push
        run: |
          NEW_VERSION="${{ github.event.client_payload.version }}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore(release): bump version to $NEW_VERSION" || echo "No changes to commit"
          git push
