name: "Release"

# =============================================================================
# RELEASE PIPELINE STATUS: DISCONNECTED (Manual / Paused during DB development)
# 
# HOW TO RECONNECT / RE-ENABLE AUTOMATIC RELEASES:
# When you are ready to publish releases on every push to main, uncomment lines 14-20:
#
# on:
#   push:
#     branches:
#       - main
#     paths-ignore:
#       - 'docs/**'
#       - '*.md'
#       - '.gitignore'
# =============================================================================

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. WINDOWS BUILD (Setup EXE, MSI, Portable EXE, ZIP)
  # =========================================================================
  build-windows:
    name: "Build Windows (x64)"
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Extract version and sanitize config
        id: prep
        shell: pwsh
        run: |
          $confPath = "apps/desktop/src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $version = $conf.version
          Write-Host "Detected Send2Me Version: $version"
          "VERSION=$version" >> $env:GITHUB_OUTPUT

          if ($conf.bundle -and $conf.bundle.windows -and $conf.bundle.windows.certificateThumbprint) {
              $conf.bundle.windows.PSObject.Properties.Remove('certificateThumbprint')
              $conf | ConvertTo-Json -Depth 10 | Set-Content $confPath
              Write-Host "Removed local certificateThumbprint for CI build."
          }

      - name: Build Tauri Desktop Application
        working-directory: apps/desktop
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Stage Windows Release Assets
        shell: pwsh
        run: |
          $version = "${{ steps.prep.outputs.VERSION }}"
          $stageDir = "windows_assets"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          # 1. NSIS Setup
          $nsis = Get-ChildItem -Path "target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsis) { $nsis = Get-ChildItem -Path "target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if ($nsis) {
              Copy-Item -Path $nsis.FullName -Destination (Join-Path $stageDir "Send2Me_${version}_x64-setup.exe") -Force
          }

          # 2. MSI Package
          $msi = Get-ChildItem -Path "target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msi) { $msi = Get-ChildItem -Path "target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if ($msi) {
              Copy-Item -Path $msi.FullName -Destination (Join-Path $stageDir "Send2Me_${version}_x64.msi") -Force
          }

          # 3. Portable Binary & ZIP
          $bin = "target/x86_64-pc-windows-msvc/release/desktop.exe"
          if (-not (Test-Path $bin)) { $bin = "target/release/desktop.exe" }
          if (Test-Path $bin) {
              $portable = Join-Path $stageDir "Send2Me_${version}_x64-portable.exe"
              Copy-Item -Path $bin -Destination $portable -Force
              Compress-Archive -Path $portable -DestinationPath (Join-Path $stageDir "Send2Me_${version}_windows-x64.zip") -Force
          }

          Get-ChildItem -Path $stageDir | ForEach-Object { Write-Host "Staged Windows Asset: $($_.Name) ($($_.Length) bytes)" }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: windows_assets/*
          retention-days: 7

  # =========================================================================
  # 2. MACOS BUILD (Apple Silicon ARM64 & Intel x86_64 DMG)
  # =========================================================================
  build-macos:
    name: "Build macOS (Apple Silicon & Intel)"
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain (Apple Silicon & Intel targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Build macOS DMG (Apple Silicon arm64)
        working-directory: apps/desktop
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: Build macOS DMG (Intel x86_64)
        working-directory: apps/desktop
        run: npm run tauri build -- --target x86_64-apple-darwin

      - name: Stage macOS Release Assets
        run: |
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          mkdir -p macos_assets

          # Locate and stage arm64 DMG
          ARM_DMG=$(find target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -n 1)
          if [ -n "$ARM_DMG" ]; then
            cp "$ARM_DMG" "macos_assets/Send2Me_${VERSION}_macOS-arm64.dmg"
          fi

          # Locate and stage x86_64 DMG
          INTEL_DMG=$(find target/x86_64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -n 1)
          if [ -n "$INTEL_DMG" ]; then
            cp "$INTEL_DMG" "macos_assets/Send2Me_${VERSION}_macOS-x86_64.dmg"
          fi

          ls -lh macos_assets/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: macos_assets/*
          retention-days: 7

  # =========================================================================
  # 3. LINUX BUILD (AppImage & DEB Package)
  # =========================================================================
  build-linux:
    name: "Build Linux (x86_64 AppImage & DEB)"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Build Linux Application (AppImage & DEB)
        working-directory: apps/desktop
        run: npm run tauri build -- --target x86_64-unknown-linux-gnu

      - name: Stage Linux Release Assets
        run: |
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          mkdir -p linux_assets

          # 1. AppImage
          APPIMAGE=$(find target/x86_64-unknown-linux-gnu/release/bundle/appimage -name "*.AppImage" 2>/dev/null | head -n 1)
          if [ -n "$APPIMAGE" ]; then
            cp "$APPIMAGE" "linux_assets/Send2Me_${VERSION}_Linux-x86_64.AppImage"
          fi

          # 2. DEB
          DEB=$(find target/x86_64-unknown-linux-gnu/release/bundle/deb -name "*.deb" 2>/dev/null | head -n 1)
          if [ -n "$DEB" ]; then
            cp "$DEB" "linux_assets/Send2Me_${VERSION}_Linux-x86_64.deb"
          fi

          # 3. Binary tar.gz
          if [ -f "target/x86_64-unknown-linux-gnu/release/desktop" ]; then
            tar -czf "linux_assets/Send2Me_${VERSION}_Linux-x86_64.tar.gz" -C target/x86_64-unknown-linux-gnu/release desktop
          fi

          ls -lh linux_assets/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: linux_assets/*
          retention-days: 7

  # =========================================================================
  # 4. UNIFIED RELEASE PUBLISHER (Aggregates All Platforms + SHA256SUMS)
  # =========================================================================
  publish-release:
    name: "Publish Multi-Platform Release"
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux]
    if: always() && (needs.build-windows.result == 'success' || needs.build-macos.result == 'success' || needs.build-linux.result == 'success')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: staged_downloads

      - name: Consolidate Assets & Generate Cryptographic SHA256SUMS
        id: consolidate
        run: |
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v$VERSION" >> $GITHUB_OUTPUT

          mkdir -p all_release_assets

          # Flatten all downloaded artifacts into all_release_assets
          find staged_downloads -type f -exec cp {} all_release_assets/ \;

          cd all_release_assets
          # Remove any previous SHA256 file
          rm -f SHA256SUMS.txt

          # Generate SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          echo "=== Unified SHA256SUMS.txt ==="
          cat SHA256SUMS.txt
          cd ..

      - name: Validate Release Artifacts Integrity
        run: |
          COUNT=$(find all_release_assets -type f | wc -l)
          echo "Total release assets staged across all platforms: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No release assets staged!"
            exit 1
          fi

      - name: Upload Unified Workflow Run Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Send2Me-All-Devices-Release-${{ steps.consolidate.outputs.VERSION }}
          path: all_release_assets/*
          retention-days: 30

      - name: Create Git Tag (if not exists)
        run: |
          TAG="${{ steps.consolidate.outputs.TAG_NAME }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, deleting and re-creating..."
            git tag -d "$TAG" 2>/dev/null || true
            git push origin ":refs/tags/$TAG" 2>/dev/null || true
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "Created and pushed tag: $TAG"

      - name: Delete Existing Release (if exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.consolidate.outputs.TAG_NAME }}"
          # Delete any existing release for this tag so we get a clean publish
          gh release delete "$TAG" --yes 2>/dev/null || echo "No existing release to delete."

      - name: Publish Public GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.consolidate.outputs.TAG_NAME }}"
          VERSION="${{ steps.consolidate.outputs.VERSION }}"

          gh release create "$TAG" \
            all_release_assets/* \
            --title "Send2Me v${VERSION} (All Devices)" \
            --notes "## Send2Me Universal Desktop v${VERSION}

          Fast, localized, zero-cloud peer-to-peer file transfer and folder sync for all your devices.

          ---

          ### 🚀 Official Downloads by Operating System

          #### 🪟 Windows (10 / 11)
          | Package | Type | Description |
          | :--- | :--- | :--- |
          | **Send2Me_${VERSION}_x64-setup.exe** | **Setup Installer (Recommended)** | Standard Windows installer with start-menu shortcuts and firewall setup. |
          | **Send2Me_${VERSION}_x64.msi** | **Enterprise MSI** | Enterprise Windows Installer for silent / Group Policy deployments. |
          | **Send2Me_${VERSION}_x64-portable.exe** | **Portable Binary** | Standalone zero-install executable. |
          | **Send2Me_${VERSION}_windows-x64.zip** | **Portable ZIP** | Compressed archive containing standalone executable. |

          #### 🍎 macOS (Apple Silicon & Intel)
          | Package | Architecture | Description |
          | :--- | :--- | :--- |
          | **Send2Me_${VERSION}_macOS-arm64.dmg** | **Apple Silicon (M1/M2/M3/M4)** | Drag-and-drop installer for Apple Silicon Macs. |
          | **Send2Me_${VERSION}_macOS-x86_64.dmg** | **Intel Mac (x86_64)** | Drag-and-drop installer for Intel Macs. |

          #### 🐧 Linux (All Distributions)
          | Package | Format | Description |
          | :--- | :--- | :--- |
          | **Send2Me_${VERSION}_Linux-x86_64.AppImage** | **Universal AppImage** | Runs on Ubuntu, Debian, Fedora, Arch, and any modern Linux distro. |
          | **Send2Me_${VERSION}_Linux-x86_64.deb** | **Debian / Ubuntu Package** | Native .deb installer. |
          | **Send2Me_${VERSION}_Linux-x86_64.tar.gz** | **Standalone Tarball** | Portable Linux binary archive. |

          ---

          ### 🔒 Cryptographic Verification
          Verify the SHA-256 integrity of your downloaded package:
          - **Windows PowerShell:** \`Get-FileHash -Algorithm SHA256 .\Send2Me-Setup.exe\`
          - **Linux / macOS:** \`sha256sum Send2Me-Linux-x86_64.AppImage\`
          - Check against **SHA256SUMS.txt** attached below."
