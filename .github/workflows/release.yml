name: "Release"

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. WINDOWS BUILD (Setup EXE, MSI, Portable EXE, ZIP)
  # =========================================================================
  build-windows:
    name: "Build Windows (x64)"
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Extract version and sanitize config
        id: prep
        shell: pwsh
        run: |
          $confPath = "apps/desktop/src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $version = $conf.version
          Write-Host "Detected Send2Me Version: $version"
          "VERSION=$version" >> $env:GITHUB_OUTPUT

          if ($conf.bundle -and $conf.bundle.windows -and $conf.bundle.windows.certificateThumbprint) {
              $conf.bundle.windows.PSObject.Properties.Remove('certificateThumbprint')
              $conf | ConvertTo-Json -Depth 10 | Set-Content $confPath
              Write-Host "Removed local certificateThumbprint for CI build."
          }

      - name: Build Tauri Desktop Application
        working-directory: apps/desktop
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Stage Windows Release Assets
        shell: pwsh
        run: |
          $version = "${{ steps.prep.outputs.VERSION }}"
          $stageDir = "windows_assets"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          # 1. NSIS Setup
          $nsis = Get-ChildItem -Path "target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsis) { $nsis = Get-ChildItem -Path "target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if ($nsis) {
              Copy-Item -Path $nsis.FullName -Destination (Join-Path $stageDir "Send2Me_${version}_x64-setup.exe") -Force
          }

          # 2. MSI Package
          $msi = Get-ChildItem -Path "target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msi) { $msi = Get-ChildItem -Path "target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if ($msi) {
              Copy-Item -Path $msi.FullName -Destination (Join-Path $stageDir "Send2Me_${version}_x64.msi") -Force
          }

          # 3. Portable Binary & ZIP
          $bin = "target/x86_64-pc-windows-msvc/release/desktop.exe"
          if (-not (Test-Path $bin)) { $bin = "target/release/desktop.exe" }
          if (Test-Path $bin) {
              $portable = Join-Path $stageDir "Send2Me_${version}_x64-portable.exe"
              Copy-Item -Path $bin -Destination $portable -Force
              Compress-Archive -Path $portable -DestinationPath (Join-Path $stageDir "Send2Me_${version}_windows-x64.zip") -Force
          }

          Get-ChildItem -Path $stageDir | ForEach-Object { Write-Host "Staged Windows Asset: $($_.Name) ($($_.Length) bytes)" }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: windows_assets/*
          retention-days: 7

  # =========================================================================
  # 2. ANDROID BUILD (ARM64-v8a + Universal APKs - Compatible with Android 10+ / Galaxy S9+)
  # =========================================================================
  build-android:
    name: "Build Android APK (ARM64 & Universal)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK (v17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Platform Tools
        run: |
          sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Initialize Android Target & Apply Android 10+ Stability Fixes
        working-directory: apps/desktop
        run: |
          npm run tauri android init -- --ci --skip-targets-install
          chmod +x src-tauri/gen/android/gradlew 2>/dev/null || true
          node scripts/patch-android.cjs

      - name: Build Android Release APKs
        working-directory: apps/desktop
        run: |
          npm run tauri android build -- --apk --target aarch64 armv7 --ci --split-per-abi

      - name: Stage Android Release Assets
        run: |
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          mkdir -p android_assets

          # Copy APK outputs
          find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec cp {} android_assets/ \;
          
          # Rename nicely if standard naming exists
          if ls android_assets/*arm64*.apk 1> /dev/null 2>&1; then
            mv android_assets/*arm64*.apk "android_assets/Send2Me_${VERSION}_Android-arm64-v8a.apk"
          fi
          if ls android_assets/*universal*.apk 1> /dev/null 2>&1; then
            mv android_assets/*universal*.apk "android_assets/Send2Me_${VERSION}_Android-universal.apk"
          fi
          if ls android_assets/*release*.apk 1> /dev/null 2>&1; then
            mv android_assets/*release*.apk "android_assets/Send2Me_${VERSION}_Android-arm64-v8a.apk" 2>/dev/null || true
          fi

          ls -lh android_assets/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-assets
          path: android_assets/*
          retention-days: 7

  # =========================================================================
  # 3. MACOS BUILD (Apple Silicon ARM64 & Intel x86_64 DMG)
  # =========================================================================
  build-macos:
    name: "Build macOS (Apple Silicon & Intel)"
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain (Apple Silicon & Intel targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Build macOS DMG (Apple Silicon arm64)
        working-directory: apps/desktop
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: Build macOS DMG (Intel x86_64)
        working-directory: apps/desktop
        run: npm run tauri build -- --target x86_64-apple-darwin

      - name: Stage macOS Release Assets
        run: |
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          mkdir -p macos_assets

          # Locate and stage arm64 DMG
          ARM_DMG=$(find target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -n 1)
          if [ -n "$ARM_DMG" ]; then
            cp "$ARM_DMG" "macos_assets/Send2Me_${VERSION}_macOS-arm64.dmg"
          fi

          # Locate and stage x86_64 DMG
          INTEL_DMG=$(find target/x86_64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -n 1)
          if [ -n "$INTEL_DMG" ]; then
            cp "$INTEL_DMG" "macos_assets/Send2Me_${VERSION}_macOS-x86_64.dmg"
          fi

          ls -lh macos_assets/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: macos_assets/*
          retention-days: 7

  # =========================================================================
  # 4. LINUX BUILD (AppImage & DEB Package)
  # =========================================================================
  build-linux:
    name: "Build Linux (x86_64 AppImage & DEB)"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Build Linux Application (AppImage & DEB)
        working-directory: apps/desktop
        run: npm run tauri build -- --target x86_64-unknown-linux-gnu

      - name: Stage Linux Release Assets
        run: |
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          mkdir -p linux_assets

          # 1. AppImage
          APPIMAGE=$(find target/x86_64-unknown-linux-gnu/release/bundle/appimage -name "*.AppImage" 2>/dev/null | head -n 1)
          if [ -n "$APPIMAGE" ]; then
            cp "$APPIMAGE" "linux_assets/Send2Me_${VERSION}_Linux-x86_64.AppImage"
          fi

          # 2. DEB
          DEB=$(find target/x86_64-unknown-linux-gnu/release/bundle/deb -name "*.deb" 2>/dev/null | head -n 1)
          if [ -n "$DEB" ]; then
            cp "$DEB" "linux_assets/Send2Me_${VERSION}_Linux-x86_64.deb"
          fi

          # 3. Binary tar.gz
          if [ -f "target/x86_64-unknown-linux-gnu/release/desktop" ]; then
            tar -czf "linux_assets/Send2Me_${VERSION}_Linux-x86_64.tar.gz" -C target/x86_64-unknown-linux-gnu/release desktop
          fi

          ls -lh linux_assets/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: linux_assets/*
          retention-days: 7

  # =========================================================================
  # 5. UNIFIED RELEASE PUBLISHER (Aggregates All Platforms + SHA256SUMS)
  # =========================================================================
  publish-release:
    name: "Publish Multi-Platform Release"
    runs-on: ubuntu-latest
    needs: [build-windows, build-android, build-macos, build-linux]
    if: always() && (needs.build-windows.result == 'success' || needs.build-android.result == 'success' || needs.build-macos.result == 'success' || needs.build-linux.result == 'success')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: staged_downloads

      - name: Consolidate Assets & Generate Cryptographic SHA256SUMS
        id: consolidate
        run: |
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v$VERSION" >> $GITHUB_OUTPUT

          mkdir -p all_release_assets

          # Flatten all downloaded artifacts into all_release_assets
          find staged_downloads -type f -exec cp {} all_release_assets/ \;

          cd all_release_assets
          # Remove any previous SHA256 file
          rm -f SHA256SUMS.txt

          # Generate SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          echo "=== Unified SHA256SUMS.txt ==="
          cat SHA256SUMS.txt
          cd ..

      - name: Validate Release Artifacts Integrity
        run: |
          COUNT=$(find all_release_assets -type f | wc -l)
          echo "Total release assets staged across all platforms: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No release assets staged!"
            exit 1
          fi

      - name: Upload Unified Workflow Run Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Send2Me-All-Devices-Release-${{ steps.consolidate.outputs.VERSION }}
          path: all_release_assets/*
          retention-days: 30

      - name: Publish Public GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.consolidate.outputs.TAG_NAME }}
          name: "Send2Me v${{ steps.consolidate.outputs.VERSION }} (All Devices)"
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: all_release_assets/*
          body: |
            ## Send2Me Universal Desktop & Mobile v${{ steps.consolidate.outputs.VERSION }}

            Fast, localized, zero-cloud peer-to-peer file transfer and folder sync for all your devices.

            ---

            ### 🚀 Official Downloads by Operating System

            #### 🪟 Windows (10 / 11)
            | Package | Type | Description |
            | :--- | :--- | :--- |
            | **`Send2Me_${{ steps.consolidate.outputs.VERSION }}_x64-setup.exe`** | **Setup Installer (Recommended)** | Standard Windows installer with start-menu shortcuts and firewall setup. |
            | **`Send2Me_${{ steps.consolidate.outputs.VERSION }}_x64.msi`** | **Enterprise MSI** | Enterprise Windows Installer for silent / Group Policy deployments. |
            | **`Send2Me_${{ steps.consolidate.outputs.VERSION }}_x64-portable.exe`** | **Portable Binary** | Standalone zero-install executable. |
            | **`Send2Me_${{ steps.consolidate.outputs.VERSION }}_windows-x64.zip`** | **Portable ZIP** | Compressed archive containing standalone executable. |

            #### 🤖 Android (Phone, Tablet & TV)
            | Package | Compatibility | Description |
            | :--- | :--- | :--- |
            | **`Send2Me_${{ steps.consolidate.outputs.VERSION }}_Android-arm64-v8a.apk`** | **Android 10+ (Galaxy S9+, Modern Phones)** | High-performance 64-bit APK with Scoped Storage & WiFi Multicast support. |
            | **`Send2Me_${{ steps.consolidate.outputs.VERSION }}_Android-universal.apk`** | **Android 7.0+ (Universal All Devices)** | Compatible with all ARM32, ARM64, and x86 Android devices. |

            #### 🍎 macOS (Apple Silicon & Intel)
            | Package | Architecture | Description |
            | :--- | :--- | :--- |
            | **`Send2Me_${{ steps.consolidate.outputs.VERSION }}_macOS-arm64.dmg`** | **Apple Silicon (M1/M2/M3/M4)** | Drag-and-drop installer for Apple Silicon Macs. |
            | **`Send2Me_${{ steps.consolidate.outputs.VERSION }}_macOS-x86_64.dmg`** | **Intel Mac (x86_64)** | Drag-and-drop installer for Intel Macs. |

            #### 🐧 Linux (All Distributions)
            | Package | Format | Description |
            | :--- | :--- | :--- |
            | **`Send2Me_${{ steps.consolidate.outputs.VERSION }}_Linux-x86_64.AppImage`** | **Universal AppImage** | Runs on Ubuntu, Debian, Fedora, Arch, and any modern Linux distro. |
            | **`Send2Me_${{ steps.consolidate.outputs.VERSION }}_Linux-x86_64.deb`** | **Debian / Ubuntu Package** | Native `.deb` installer. |
            | **`Send2Me_${{ steps.consolidate.outputs.VERSION }}_Linux-x86_64.tar.gz`** | **Standalone Tarball** | Portable Linux binary archive. |

            ---

            ### 🔒 Cryptographic Verification
            Verify the SHA-256 integrity of your downloaded package:
            - **Windows PowerShell:** `Get-FileHash -Algorithm SHA256 .\Send2Me-Setup.exe`
            - **Linux / macOS:** `sha256sum Send2Me-Linux-x86_64.AppImage`
            - Check against **`SHA256SUMS.txt`** attached below.
